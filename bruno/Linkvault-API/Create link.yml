info:
  name: Create link
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/links"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "   {\"title\": \"Google\", \"url\": \"https://www.google.com/\", \"tag\": \"demo\"}

      \   "
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
