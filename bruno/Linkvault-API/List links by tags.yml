info:
  name: List links by tags
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/links?tags=docs"
  params:
    - name: tags
      value: docs
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
